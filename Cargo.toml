[package]
name = "cb-digest"
version = "0.2.0"
authors = ["Adarsh Srivastava <adarsh@ctrlb.ai>"]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ctrlb-hq/cb-digest"
homepage = "https://github.com/ctrlb-hq/cb-digest"
description = """
A direct port of the Golang DDSketch implementation.
"""
exclude = [".gitignore"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { package = "serde", version = "1.0", optional = true, features = ["derive", "serde_derive"] }
rkyv = { version = "0.8.10", optional = true }

[dev-dependencies]
approx = "0.5.1"
rand = "0.8.5"
rand_distr = "0.4.3"

[features]
default = ["use_rkyv"]
use_serde = ["serde", "serde/derive"]
use_rkyv = ["rkyv"]

